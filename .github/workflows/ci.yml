name: Flutter CI & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static code analysis
        run: flutter analyze

      - name: Run automated tests
        run: flutter test

      - name: Configure Keystore and Signing
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          sed -i '/org.gradle.java.home/d' android/gradle.properties
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          cat <<EOF > android/key.properties
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storeFile=release-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          EOF

      - name: Build Android Release APK
        if: github.ref == 'refs/heads/main'
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: flutter build apk --release --android-skip-build-dependency-validation --dart-define=BACKEND_URL="$BACKEND_URL" --dart-define=SENTRY_DSN="$SENTRY_DSN"

      - name: Upload Release APK Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
